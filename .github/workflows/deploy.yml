name: Deploy to Cloudflare Workers

# Deploys this repository's own café (chth.cafe). wrangler.jsonc is the generic config that the
# Deploy button and new owners use, so production deploys from its own config, kept as a secret:
# set CAFE_WRANGLER_CONFIG to the contents of wrangler.production.jsonc (with the real database
# and namespace IDs and the custom domain routes). Without it this workflow only builds.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Assets
        run: npm run build

      - name: Check Cloudflare credentials
        id: check-creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CAFE_CONFIG: ${{ secrets.CAFE_WRANGLER_CONFIG }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CAFE_CONFIG" ]; then
            echo "::warning ::Set the CLOUDFLARE_API_TOKEN and CAFE_WRANGLER_CONFIG secrets to deploy the café. Skipping deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$CAFE_CONFIG" > wrangler.production.jsonc
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Workers
        if: steps.check-creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler.production.jsonc
