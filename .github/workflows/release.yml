name: Release

# Packages every push to the default branch as a versioned café release, attaches it to a GitHub
# release, and deploys the control plane with it, so owners see "Update to <version>" on their dashboard.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build and package
        id: package
        run: |
          npm run release
          echo "version=$(node -p "require('./release/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          tar -czf "cafe-release-$VERSION.tar.gz" -C release .
          gh release create "cafe-v$VERSION" "cafe-release-$VERSION.tar.gz" release/manifest.json \
            --target "$GITHUB_SHA" --title "Café $VERSION" \
            --notes "Café release built from $GITHUB_SHA. The control plane deploys this version to owners' Cloudflare accounts."

      - name: Check Cloudflare credentials
        id: check-creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN is not set. Skipping the control plane deploy."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy control plane
        if: steps.check-creds.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c control-plane/wrangler.jsonc
