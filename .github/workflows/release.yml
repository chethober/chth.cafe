name: Release

# Packages every push to the default branch as a versioned café release (vX.Y.Z, the patch number
# raised by each push), attaches it to a GitHub release, and deploys the control plane with it, so
# owners see "Update to <version>" on their dashboard. The CHTH hub posts each release to the
# updates channel. A push that changes nothing in the café itself (only the landing and control
# plane, CI, docs or tests) keeps the latest version and publishes no release.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from the tags, the notes from the commits since

      - name: Work out the version
        id: plan
        env:
          RELEASE_EXCLUDE: control-plane
        run: |
          node .github/scripts/release.mjs plan
          echo "RELEASE_VERSION=$(grep '^version=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build and package
        id: package
        run: |
          npm run release
          echo "version=$(node -p "require('./release/manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Publish GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          RELEASE_EXCLUDE: control-plane
          RELEASE_TITLE: CHTH Café
        run: |
          tar -czf "cafe-release-$VERSION.tar.gz" -C release .
          node .github/scripts/release.mjs publish "cafe-release-$VERSION.tar.gz" release/manifest.json

      - name: Check Cloudflare credentials
        id: check-creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN is not set. Skipping the control plane deploy."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy control plane
        if: steps.check-creds.outputs.has_token == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c control-plane/wrangler.jsonc
